<svg xmlns="http://www.w3.org/2000/svg" width="800" height="50" viewBox="0 0 800 50">
  <style>
    text{font:600 22px 'Courier New',monospace;fill:#36bcf7;opacity:0;animation:cycle 15s infinite both}
    @keyframes cycle{
      0%{opacity:0;clip-path:inset(0 100% 0 0)}
      1%{opacity:1;clip-path:inset(0 100% 0 0)}
      9%{clip-path:inset(0 0 0 0)}
      18%{opacity:1;clip-path:inset(0 0 0 0)}
      20%{opacity:0}
      100%{opacity:0}
    }
  </style>
  <text x="400" y="32" text-anchor="middle" style="animation-delay:0s">8+ years building scalable systems</text>
  <text x="400" y="32" text-anchor="middle" style="animation-delay:3s">Full-Stack | Backend | AI Agents</text>
  <text x="400" y="32" text-anchor="middle" style="animation-delay:6s">Python · TypeScript · Go</text>
  <text x="400" y="32" text-anchor="middle" style="animation-delay:9s">Cloud-native: Docker · Kubernetes · AWS</text>
  <text x="400" y="32" text-anchor="middle" style="animation-delay:12s">Clean code. Reliable systems.</text>
</svg>