<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="260" viewBox="0 0 1000 260" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f2027"/>
      <stop offset="0.5" stop-color="#203a43"/>
      <stop offset="1" stop-color="#2c5364"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#36bcf7"/>
    </linearGradient>
  </defs>
  <style>
    .name{font:700 64px 'Segoe UI',Helvetica,Arial,sans-serif;fill:url(#name);animation:rise 1.4s ease-out both}
    .sub{font:500 22px 'Segoe UI',Helvetica,Arial,sans-serif;fill:#b8d4e3;letter-spacing:3px;animation:rise 1.4s .5s ease-out both}
    .tag{font:500 15px 'Courier New',monospace;fill:#36bcf7;animation:rise 1.4s 1s ease-out both}
    .dot{fill:#36bcf7;opacity:.5;animation:float 6s ease-in-out infinite}
    @keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
    @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
  </style>
  <rect width="1000" height="260" fill="url(#bg)"/>
  <circle class="dot" cx="120" cy="60" r="4"/>
  <circle class="dot" cx="860" cy="80" r="5" style="animation-delay:1s"/>
  <circle class="dot" cx="700" cy="40" r="3" style="animation-delay:2s"/>
  <circle class="dot" cx="260" cy="170" r="3" style="animation-delay:3s"/>
  <circle class="dot" cx="930" cy="170" r="4" style="animation-delay:4s"/>
  <text class="name" x="500" y="115" text-anchor="middle">Shoaib Ismail</text>
  <text class="sub" x="500" y="158" text-anchor="middle">SENIOR FULL-STACK &amp; BACKEND ENGINEER</text>
  <text class="tag" x="500" y="190" text-anchor="middle">&lt;/&gt; python · typescript · go · cloud · ai agents</text>
  <path fill="#36bcf7" fill-opacity="0.25" d="M0,230 C150,200 300,260 500,230 C700,200 850,260 1000,230 L1000,260 L0,260 Z">
    <animate attributeName="d" dur="7s" repeatCount="indefinite"
      values="M0,230 C150,200 300,260 500,230 C700,200 850,260 1000,230 L1000,260 L0,260 Z;
              M0,230 C150,260 300,200 500,230 C700,260 850,200 1000,230 L1000,260 L0,260 Z;
              M0,230 C150,200 300,260 500,230 C700,200 850,260 1000,230 L1000,260 L0,260 Z"/>
  </path>
  <path fill="#36bcf7" fill-opacity="0.45" d="M0,245 C200,225 350,265 550,245 C750,225 900,265 1000,245 L1000,260 L0,260 Z">
    <animate attributeName="d" dur="5s" repeatCount="indefinite"
      values="M0,245 C200,225 350,265 550,245 C750,225 900,265 1000,245 L1000,260 L0,260 Z;
              M0,245 C200,265 350,225 550,245 C750,265 900,225 1000,245 L1000,260 L0,260 Z;
              M0,245 C200,225 350,265 550,245 C750,225 900,265 1000,245 L1000,260 L0,260 Z"/>
  </path>
</svg>